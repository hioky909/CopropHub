services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coprophub
      POSTGRES_USER: coprophub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coprophub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations Prisma (dont l'index unique partiel et les CHECK
  # écrits à la main) puis s'arrête. Utilise l'étape `build` de l'image, qui
  # contient le CLI Prisma (absent de l'image finale du backend).
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    command: ["npm", "run", "prisma:migrate:deploy", "--workspace=apps/backend"]
    environment:
      DATABASE_URL: postgresql://coprophub:${DB_PASSWORD:-change-me}@db:5432/coprophub
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Boîte mail de développement : capture tous les emails envoyés par le backend
  # (mot de passe oublié) sans rien expédier réellement. Interface : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://coprophub:${DB_PASSWORD:-change-me}@db:5432/coprophub
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      PORT: 3000
      NODE_ENV: production
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "CopropHub <no-reply@coprophub.local>"
      APP_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
