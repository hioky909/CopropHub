name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coprophub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrer la base de test
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/coprophub_test

      - name: Vérifier l'alignement du schéma Prisma et de la base migrée
        run: npm run prisma:drift
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/coprophub_test

      - name: Tests unitaires
        run: npm run test -- --coverage

      - name: Tests frontend (Vitest + React Testing Library)
        run: npm run test:frontend

      - name: Tests d'intégration (base PostgreSQL réelle)
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/coprophub_test

      - name: Build
        run: npm run build

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend

      - name: Tests E2E (Playwright, backend + frontend + PostgreSQL réels)
        run: npm run test:e2e --workspace=apps/frontend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/coprophub_test

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déployer
        run: echo "Étape de déploiement (Docker Compose / plateforme cloud, cf. Doc 8 CI/CD)"
